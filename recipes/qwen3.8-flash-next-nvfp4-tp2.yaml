recipe_version: "1"
name: Qwen3.8-Flash-Next-FP4-Local-TP2
description: nvidia/Qwen3.8-Flash-Next-FP4-Local, TP=2 across BOTH Sparks, no EP, B12X engine, MTP-4. Drop-in for the old RadixArk Flash-Next endpoint (same served name, port 8006). UNBENCHMARKED here.

# 2026-11-12: upstream eugr recipes/qwen3.8-flash-next-nvfp4-cluster.yaml (upstream/main
# 6430ce1), unchanged except: port, --served-model-name, HF_HUB_OFFLINE.
# Every tuning value below is upstream's / the model card's — nothing measured on this fleet.
#
# Checkpoint (rev b9ce18a6, on .30 and .31): qwen4_exp, 48 layers (36 GDN + 12 full-attn),
# 512 experts / 10 active, 96 GiB on disk in 21 shards. NOT the 27B's architecture — none
# of the 27B recipe's byte caps or batch tuning transfer.
model: nvidia/Qwen3.8-Flash-Next-FP4-Local

# --exp-b12x pulls the prebuilt B12X image (eugr/spark-vllm-b12x) instead of building.
container: vllm-node-b12x
build_args:
  - --exp-b12x

cluster_only: true

defaults:
  # Same endpoint as the previous Flash-Next deployment: the gateway route
  # `qwen/3.8-flash-next-nvfp4` points at http://192.168.2.30:8006/v1 (head must be .30).
  port: 8006
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 4096
  num_speculative_tokens: 4
  # Upstream's value with PLE tables on the GPU. ~84 GiB/rank => this model owns the pair;
  # it cannot co-host with `general`. No kv byte cap yet: nothing measured to size it from.
  gpu_memory_utilization: 0.7

env:
  HF_HUB_OFFLINE: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  NCCL_BUFFSIZE: "1048576"
  NCCL_MAX_CTAS: "8"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

# --served-model-name: answers as the previously hosted RadixArk build, so the gateway's
#   `openai/RadixArk/Qwen3.8-Flash-Next-NVFP4` route needs no change.
# No --enable-expert-parallel: plain TP=2 (b12x has no EP path anyway).
command: |
  vllm serve nvidia/Qwen3.8-Flash-Next-FP4-Local \
    --served-model-name RadixArk/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --additional-config '{{"ple_table_memory":"device"}}' \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}, "draft_tensor_parallel_size": {tensor_parallel} }}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
