recipe_version: "1"
name: Qwen3.6-27B-NVFP4-Unsloth
description: Unsloth Qwen3.6-27B NVFP4 (vision; MTP disabled). Replacement for the natfii/thinkingcap 27B. Single Spark TP=1.

# Verified from the on-disk config.json (main ref ccdaab7e, 5 shards, 23.4 GB):
#   architectures: Qwen3_5ForConditionalGeneration  (dense-hybrid, 64 layers)
#   vision_config present, language_model_only=false   => images + video
#   mtp_num_hidden_layers = 1                          => MTP head present
#   quantization_config: compressed-tensors, nvfp4-pack-quantized (group_size 16)
# NOTE: an older single-file revision (890bdef, model.safetensors 26.4 GB) is also in the
# HF cache. refs/main points at the sharded one — do not pin the old rev (see the
# fastsafetensors single-file crash note).
model: unsloth/Qwen3.6-27B-NVFP4

container: vllm-node-tf5
build_args:
  - --tf5

# CO-HOSTED with `general` (35B) on .31 since 2026-07-24 (.30 freed for the Laguna tester).
# Dense-hybrid (Gated DeltaNet + full-attention layers) => TP=1.
solo_only: false

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # HARD byte cap on the KV cache (native --kv-cache-memory-bytes, profiler-bypassed).
  # CO-HOST budget: hard ~50 GB slice each so 50 + 50 on the 120 GB node leaves ~20 GB for
  # activations + host. weights 23.4 + overhead ~12 + KV 14 = ~49 GB slice.
  # (Solo history: pool was 55 GiB while alone on .30, 2026-07-20 .. 07-24.)
  kv_cache_memory_bytes: 15032385536   # 14 * 1024^3
  # Startup free-memory GATE + ceiling. 0.45 => 54 GB (0.45 x 120); >= the ~49 GB slice, and
  # the 2nd co-tenant still boots (free ~65 GB after the 1st's 50 GB, >= the 54 GB gate).
  gpu_memory_utilization: 0.45
  max_model_len: 262144
  # 8192 (was 4096) — vLLM warns on every boot that the MTP draft slots squeeze this
  # budget: "max_num_scheduled_tokens is set to 4096 based on the speculative decoding
  # settings ... Consider increasing max_num_batched_tokens".
  max_num_batched_tokens: 8192
  max_num_seqs: 128
  # MTP 3 (2026-07-22, was 6). Under sustained batch-32 load, position rates decayed to
  # 0.774/0.562/0.410/0.306/0.227/0.170 — positions 4-5 accept <25%, and each extra draft
  # position costs a flat pass while acceptance decays geometrically, so deep drafting earns
  # less at high concurrency than at batch 1. 3 trims the low-value tail. NOTE: not yet
  # A/B-measured on generation_tokens_total — at LOW batch, 6 still won (pos 5 ~0.37).
  # If most traffic is single-stream, 6 is better; 3 favors the batch-heavy fanout workload.
  num_speculative_tokens: 3

# --safetensors-load-strategy prefetch: vLLM only auto-enables its multi-threaded loader
#   on network filesystems ("Auto-prefetch is disabled because the filesystem (EXT4) is
#   not a recognized network FS (NFS/Lustre)"), so on local disk it loads SINGLE-THREADED
#   — one CPU core doing mmap+copy through 22 GB. Forcing prefetch spreads it over
#   safetensors_prefetch_num_threads (default 8). Costs read-ahead RAM; fine here with
#   ~90 GB free, but this is exactly the guard that (correctly) refused on the 79 GB 122B.
# --compilation-config max_cudagraph_capture_size=128: the default captures graphs up to
#   512 (1,2,4,8,16,24,32,...,512) but max_num_seqs is 128, so every size above 128 can
#   never be used — ~24 dead graphs costing capture time and pinned static buffers.
#   Capture SIZES keep vLLM's default granularity (powers of 2 to 16, then steps of 8):
#   that bounds padding waste at <=8 seqs at any batch. Pure powers of 2 would be worse —
#   batch 65 would pad to 128 (~49% wasted) instead of 72.
env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # vLLM's CUDA-graph memory ESTIMATOR is buggy on this build (reports negative GiB),
  # inflating "available KV cache" past the byte cap. Disabling it makes the cap hold.
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  # Compile cute-DSL / CUTLASS kernels for GB10. Read by nvidia-cutlass-dsl itself
  # (4.5.2 in this image), so it is safe regardless of the vLLM version.
  CUTE_DSL_ARCH: "sm_121a"
  HF_HUB_OFFLINE: "1"

# Model card, DGX Spark section, VERBATIM: "You must use the below or you will get 2x
# slower inference!"
#     export CUTE_DSL_ARCH=sm_121a
#     vllm serve unsloth/Qwen3.6-27B-NVFP4 --moe-backend flashinfer_b12x
# The card specifies NO --linear-backend. Adding one fails at load:
#   ValueError: --linear-backend=flashinfer_b12x was requested but no 'flashinfer_b12x'
#   kernel exists for this layer type.
# Card also warns: do NOT use Marlin (2x slower) — cute-DSL gives 6,863 thr tok/s vs
# Marlin's 2,403. CUTE_DSL_ARCH=sm_121a is set in env: above.
command: |
  vllm serve unsloth/Qwen3.6-27B-NVFP4 \
    --host {host} --port {port} \
    -tp {tensor_parallel} \
    --moe-backend flashinfer_b12x \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype fp8 \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --trust-remote-code \
    --no-async-scheduling \
    --safetensors-load-strategy prefetch \
    --compilation-config '{{"max_cudagraph_capture_size":128}}' \
    --limit-mm-per-prompt '{{"image":4,"video":0}}' \
    --speculative_config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}'
